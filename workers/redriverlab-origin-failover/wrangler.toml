name = "redriverlab-origin-failover"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = false

[[routes]]
pattern = "redriverlab.me/*"
zone_name = "redriverlab.me"

[[routes]]
pattern = "www.redriverlab.me/*"
zone_name = "redriverlab.me"

[[durable_objects.bindings]]
name = "ORIGIN_STATUS"
class_name = "OriginStatus"

[exports.OriginStatus]
type = "durable-object"
storage = "sqlite"
