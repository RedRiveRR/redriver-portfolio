<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Sayfa bulunamadı — RedRiverLab</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell error-page">
    <div class="error-card">
      <a href="/" aria-label="RedRiver ana sayfa"><img class="error-logo" src="/assets/rr-icon-web.png" width="68" height="68" alt="RedRiver"></a>
      <p class="eyebrow error-eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span> ERROR / 404</p>
      <h1>Bu sayfa<br><span>bulunamadı.</span></h1>
      <p>Aradığın adres mevcut değil veya taşınmış olabilir.</p>
      <a class="button button-light" href="/">Ana sayfaya dön <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <style>
    .error-page { min-height: 100svh; display: grid; place-items: center; }
    .error-card { width: min(100%, 620px); padding-block: 60px; }
    .error-logo { width: 68px; height: 68px; object-fit: contain; margin-bottom: 32px; }
    .error-eyebrow { margin-bottom: 20px; }
    .error-card h1 { margin: 0 0 18px; font-size: clamp(3.2rem, 8vw, 5.8rem); line-height: 1; letter-spacing: -.045em; }
    .error-card h1 span { color: var(--color-ink-3); }
    .error-card > p:not(.eyebrow) { margin: 0 0 26px; color: var(--color-ink-3); line-height: 1.7; }
  </style>
</body>
</html>
